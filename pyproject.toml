[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-fiap-assistant"
version = "0.1.0"
description = "Hospital FIAP clinical assistant — FIAP POS Tech Fase 3 Tech Challenge"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*", "langgraph_flows*", "security*", "fine_tuning*"]
